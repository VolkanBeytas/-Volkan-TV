plugins {
    id 'com.android.application'
}

android {
    namespace 'com.volkantv.tuner'
    compileSdk 34

    defaultConfig {
        applicationId "com.volkantv.tuner"
        minSdk 30
        targetSdk 30
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
